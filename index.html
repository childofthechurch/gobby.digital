<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gobby.digital</title>
<style>
  :root{
    --bg:#ffffff;
    --card:#ffffff;
    --ink:#1c1c1e;
    --muted:#6b6b70;
    --accent:#2f6df0;
    --line:#e7e6e1;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    padding:48px 20px 0;
  }

  .nav-wrap{width:100%;max-width:880px;margin:0 auto;}
  nav{margin-bottom:28px;display:flex;justify-content:center;gap:20px;}
  nav a{
    color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;
    letter-spacing:-0.01em;
    transition:color .15s ease;
  }
  nav a:not(.active){color:#c7c7cc;}
  nav a:not(.active):hover{color:var(--ink);}
  nav a.active{
    background:#fef08a;
    padding:1px 5px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }

  .grid-wrap{
    flex:1;min-height:0;
    overflow-y:auto;
    padding:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:12px;
    max-width:1400px;
    margin:0 auto;
  }
  .page-cell{
    position:relative;aspect-ratio:2/3;
    background:#f4f3ee;
    overflow:hidden;
  }
  .page-cell img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .page-cell.placeholder{
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--line);
    color:var(--muted);font-size:12px;
  }
  .page-cell{cursor:pointer;}

  .lightbox{
    position:fixed;inset:0;z-index:1000;
    background:#fff;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox-close{
    position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px;z-index:2;
    width:36px;height:36px;border:none;border-radius:50%;
    background:rgba(0,0,0,.06);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-close:hover{background:rgba(0,0,0,.12);}
  .lightbox-strip{
    height:100%;display:flex;align-items:center;gap:24px;
    padding:0 5vw;overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .lightbox-item{
    max-height:90vh;width:auto;flex:0 0 auto;
    scroll-snap-align:center;
  }
  img.lightbox-item{display:block;object-fit:contain;}
  div.lightbox-item{
    aspect-ratio:2/3;height:90vh;
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--line);color:var(--muted);font-size:16px;
  }

  /* Mobile: swipe vertically through pages instead of horizontally. */
  @media (max-width:700px){
    .lightbox-strip{
      flex-direction:column;width:100%;gap:0;
      padding:0;
      overflow-x:hidden;overflow-y:auto;
      scroll-snap-type:y mandatory;
    }
    .lightbox-item{max-height:100vh;max-width:100vw;scroll-snap-align:start;}
    div.lightbox-item{height:auto;max-height:100vh;}
  }
</style>
</head>
<body>

  <div class="nav-wrap">
    <nav>
      <a href="index.html" class="active">nature show</a>
      <a href="idiot_plot_CD.html">idiot plot cd</a>
    </nav>
  </div>

  <!-- ====== PAGES ======
       List real scan filenames (in reading order) in the PAGES array below.
       Any slot beyond PAGES.length up to TOTAL_PAGES renders as a placeholder. -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <div class="lightbox-strip" id="lightboxStrip"></div>
  </div>

  <script>
    const TOTAL_PAGES = 97;
    const PAGES = Array.from(
      { length: TOTAL_PAGES },
      (_, i) => `nature%20show/Nature_Show-${i + 1}.jpg`
    );

    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxStrip = document.getElementById('lightboxStrip');
    const lightboxClose = document.getElementById('lightboxClose');

    const stripItems = [];

    for (let i = 0; i < TOTAL_PAGES; i++) {
      const hasImage = i < PAGES.length;

      const cell = document.createElement('div');
      cell.className = 'page-cell';
      const stripItem = hasImage ? document.createElement('img') : document.createElement('div');
      stripItem.className = 'lightbox-item';

      if (hasImage) {
        const img = document.createElement('img');
        img.src = PAGES[i];
        img.alt = `Page ${i + 1}`;
        img.loading = 'lazy';
        img.decoding = 'async';
        cell.appendChild(img);

        stripItem.src = PAGES[i];
        stripItem.alt = `Page ${i + 1}`;
        stripItem.decoding = 'async';
      } else {
        cell.classList.add('placeholder');
        cell.textContent = i + 1;
        stripItem.textContent = i + 1;
      }

      cell.addEventListener('click', () => openLightbox(i));
      grid.appendChild(cell);
      lightboxStrip.appendChild(stripItem);
      stripItems.push(stripItem);
    }

    function openLightbox(i) {
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      const vertical = window.matchMedia('(max-width:700px)').matches;
      stripItems[i].scrollIntoView({
        behavior: 'instant',
        inline: vertical ? 'nearest' : 'center',
        block: vertical ? 'start' : 'nearest',
      });
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });
  </script>
</body>
</html>
